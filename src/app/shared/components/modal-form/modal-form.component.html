@if (isVisible) {
<div class="modal show d-block" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable" [class]="'modal-' + size">
    <div class="modal-content border-0 shadow-lg">
      <!-- Header -->
      <div class="modal-header bg-primary text-white border-0 p-4">
        <div class="d-flex align-items-center">
          <div class="bg-white bg-opacity-25 rounded-3 p-2 me-3">
            <i class="bi fs-4" [class]="icon"></i>
          </div>
          <div>
            <h4 class="modal-title mb-1">{{ title }}</h4>
            @if (subtitle) {
              <small class="opacity-75">{{ subtitle }}</small>
            }
          </div>
        </div>
        <button type="button" class="btn-close btn-close-white" (click)="onClose()"></button>
      </div>

      <!-- Body -->
      <div class="modal-body p-4 bg-light">
        <ng-container [ngTemplateOutlet]="formContent"></ng-container>
      </div>

      <!-- Footer -->
      <div class="modal-footer bg-white border-0 p-4">
        <div class="d-flex gap-2 justify-content-end w-100">
          <button type="button" class="btn btn-outline-secondary" (click)="onSecondaryAction()">
            <i class="bi bi-x me-1"></i>{{ secondaryButtonText }}
          </button>
          <button type="button" class="btn btn-primary" [disabled]="!isValid || isSubmitting" (click)="onPrimaryAction()">
            @if (isSubmitting) {
              <span class="spinner-border spinner-border-sm me-2"></span>
            } @else {
              <i class="bi bi-check me-1"></i>
            }
            {{ primaryButtonText }}
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="modal-backdrop show"></div>
}
