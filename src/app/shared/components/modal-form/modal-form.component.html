@if (isVisible) {
<div class="modal show d-block" tabindex="-1" style="background-color: rgba(0,0,0,0.5);">
  <div class="modal-dialog modal-dialog-scrollable" [class]="'modal-' + size">
    <div class="modal-content border-0 shadow">
      <div class="dashboard-container">
        <!-- Dashboard Header -->
        <div class="dashboard-header">
          <div class="header-content">
            <div class="dashboard-icon">
              <i class="bi" [class]="icon"></i>
            </div>
            <div class="header-text">
              <h1 class="dashboard-title">{{ title }}</h1>
              @if (subtitle) {
                <p class="dashboard-subtitle">{{ subtitle }}</p>
              }
            </div>
          </div>
          <button type="button" class="btn-close" (click)="onClose()"></button>
        </div>

        <!-- Form Content -->
        <div class="modal-form-content">
          <ng-container [ngTemplateOutlet]="formContent"></ng-container>
        </div>

        <!-- Footer Navigation -->
        <div class="d-flex justify-content-end gap-2 mt-4">
          <button type="button" class="btn btn-outline-secondary" (click)="onSecondaryAction()">
            {{ secondaryButtonText }}
          </button>
          <button type="button" class="btn btn-primary" [disabled]="!isValid || isSubmitting" (click)="onPrimaryAction()">
            @if (isSubmitting) {
              <span class="spinner-border spinner-border-sm me-2"></span>
            } @else {
              <i class="bi bi-check me-2"></i>
            }
            {{ primaryButtonText }}
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
}
