<div class="container-fluid px-4 py-3">
  @if (project$ | async; as project) {
  <!-- Project Header -->
  <div
    class="card border-0 shadow-sm mb-4"
    style="background: linear-gradient(135deg, #096361 0%, #0d8887 100%)"
  >
    <div class="card-body p-4 text-white">
      <div class="d-flex justify-content-between align-items-start">
        <div class="flex-grow-1">
          <div class="d-flex align-items-center mb-2">
            <i class="bi bi-kanban-fill me-3" style="font-size: 2rem; opacity: 0.9"></i>
            <div>
              <h1 class="mb-1 fw-bold">{{ project.name || 'Untitled Project' }}</h1>
              <div class="d-flex align-items-center gap-3">
                <span class="badge bg-white bg-opacity-25 px-3 py-2">#{{ project.id }}</span>
                <span
                  class="badge px-3 py-2"
                  [class]="
                    'bg-' +
                    (project.status === 'done'
                      ? 'success'
                      : project.status === 'in_progress'
                      ? 'info'
                      : project.status === 'on_hold'
                      ? 'warning'
                      : 'light text-dark')
                  "
                  >{{ project.status.replace('_', ' ') | titlecase }}</span
                >
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Tabs Section -->
  <div class="card border-0 shadow-sm">
    <app-tabs [selectedIndex]="selectedIndex">
      <app-tab label="Overview">
        <app-project-overview
          [project]="project"
          (projectUpdated)="onProjectUpdated($event)"
        ></app-project-overview>
      </app-tab>
      @if (project.type != 1) {
      <app-tab [label]="'Work Items'">
        <app-work-item-list [project]="project"></app-work-item-list>
      </app-tab>
      } @if (project.type == 1) {
      <app-tab [label]="'Milestones'">
        <app-milestones [project]="project"></app-milestones>
      </app-tab>
      }
      <!-- <app-tab label="Messages">
          <app-messages [project]="project"></app-messages>
        </app-tab> -->
      <app-tab label="Files">
        <app-files [project]="project"></app-files>
      </app-tab>
      @if (project.invoices && project.invoices.length > 0) {
      <app-tab label="Invoices">
        <app-invoices [project]="project"></app-invoices>
      </app-tab>
      }
    </app-tabs>
  </div>
  }
</div>
