<div class="dashboard-container">
  @if (project$ | async; as project) {
  <!-- Project Header -->
  <div class="dashboard-header">
    <div class="header-content">
      <div class="dashboard-icon">
        <i class="bi bi-kanban-fill"></i>
      </div>
      <div class="header-text">
        <h1 class="dashboard-title">{{ project.name || 'Untitled Project' }}</h1>
        <div class="project-meta">
          <span class="project-id">{{ project.displayId }}</span>
          <span
            class="status-badge"
            [class]="
              'status-' +
              (project.status === 'done'
                ? 'success'
                : project.status === 'in_progress'
                ? 'info'
                : project.status === 'on_hold'
                ? 'warning'
                : 'default')
            "
            >{{ project.status.replace('_', ' ') | titlecase }}</span
          >
        </div>
      </div>
    </div>
  </div>

  <!-- Tabs Section -->
  <div class="card modern-card">
    <app-tabs [selectedIndex]="selectedIndex">
      <app-tab label="Overview">
        <app-project-overview
          [project]="project"
          (projectUpdated)="onProjectUpdated($event)"
        ></app-project-overview>
      </app-tab>
      @if (project.type != 1) {
      <app-tab [label]="'Work Items'">
        <app-work-item-list [project]="project" (workItemsChanged)="onWorkItemsUpdated()"></app-work-item-list>
      </app-tab>
      } @if (project.type == 1) {
      <app-tab [label]="'Milestones'">
        <app-milestones [project]="project"></app-milestones>
      </app-tab>
      }
      <app-tab label="Files">
        <app-files [project]="project"></app-files>
      </app-tab>
      @if (project.invoices && project.invoices.length > 0) {
      <app-tab label="Invoices">
        <app-invoices [project]="project"></app-invoices>
      </app-tab>
      }
    </app-tabs>
  </div>
  }
</div>
